<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHER Studio | Contacto</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- Cabecera Semántica -->
  <header class="header-principal">
    <div class="contenedor-nav">
      <a href="index.html" class="logo">AETHER <span>STUDIO</span></a>
      <nav>
        <ul class="menu-navegacion">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="catalogo.html">Catálogo</a></li>
          <li><a href="carrito.html">Carrito <span id="contador" class="badge-carrito">0</span></a></li>
          <li><a href="contacto.html" class="activo">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="contenedor-principal">
    <section>
      <h2 style="text-align: center; margin-bottom: 0.5rem;">Atención al Cliente</h2>
      <p style="text-align: center; color: var(--color-texto-mutado); margin-bottom: 2rem;">¿Tienes alguna consulta técnica o pedido especial? Escríbenos.</p>

      <!-- Formulario con atributo novalidate (Requisito estricto R9) -->
      <form id="form-contacto" class="form-contacto" novalidate>
        <!-- Campo 1: Nombre -->
        <div class="grupo-campo">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" class="campo-input" placeholder="Ej. Carlos Mendoza">
          <small id="error-nombre" class="mensaje-error"></small>
        </div>

        <!-- Campo 2: Correo -->
        <div class="grupo-campo">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" name="correo" class="campo-input" placeholder="ejemplo@correo.com">
          <small id="error-correo" class="mensaje-error"></small>
        </div>

        <!-- Campo 3: Celular -->
        <div class="grupo-campo">
          <label for="celular">Celular de contacto</label>
          <input type="tel" id="celular" name="celular" class="campo-input" placeholder="Ej. 912345678">
          <small id="error-celular" class="mensaje-error"></small>
        </div>

        <!-- Campo 4: Mensaje -->
        <div class="grupo-campo">
          <label for="mensaje">Mensaje o Consulta</label>
          <textarea id="mensaje" name="mensaje" class="campo-input" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>
          <small id="error-mensaje" class="mensaje-error"></small>
        </div>

        <button type="submit" class="btn btn-primario" style="width: 100%; font-size: 1rem; margin-top: 0.5rem;">Enviar Mensaje</button>
        <p id="mensaje-exito" style="color: var(--color-exito); text-align: center; margin-top: 1rem; display: none; font-weight: bold;"></p>
      </form>
    </section>
  </main>

  <!-- Pie de Página Semántico -->
  <footer class="footer-principal">
    <p>&copy; 2026 AETHER Studio. Proyecto académico - Universidad Continental.</p>
  </footer>

  <!-- Carga de Scripts en Orden Estricto -->
  <script src="js/datos.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/app.js"></script>
  <script src="js/formulario.js"></script>
</body>
</html>
