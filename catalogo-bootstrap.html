<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHER Studio | Catálogo de Periféricos</title>
  <link rel="stylesheet" href="bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="header-principal">
    <div class="contenedor-nav">
      <a href="index.html" class="logo">AETHER <span>STUDIO</span></a>
      <nav class="navbar navbar-expand-md navbar-dark" data-bs-theme="dark">
  <div class="container-fluid">

    <button class="navbar-toggler" type="button"
      data-bs-toggle="collapse"
      data-bs-target="#menuAether"
      aria-controls="menuAether"
      aria-expanded="false"
      aria-label="Abrir menú">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menuAether">
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="index.html">Inicio</a>
        <a class="nav-link active" href="catalogo-bootstrap.html">Catálogo</a>
        <a class="nav-link" href="carrito.html">
          Carrito <span id="contador" class="badge-carrito">0</span>
        </a>
        <a class="nav-link" href="contacto.html">Contacto</a>
      </div>
    </div>

  </div>
</nav>
    </div>
  </header>

  <main class="contenedor-principal">
    <section class="seccion-catalogo">
      <h2>Catálogo de Equipamiento</h2>
      <p style="color: var(--color-texto-mutado); margin-bottom: 1.5rem;">Explora nuestra selección de periféricos de alta precisión.</p>

      <div class="controles-busqueda">
        <input type="text" id="buscador" class="campo-input" placeholder="Buscar por nombre..." aria-label="Buscar productos">
        <select id="filtro-categoria" class="campo-select" aria-label="Filtrar por categoría">
          <option value="todas">Todas las categorías</option>
          <option value="teclados">Teclados</option>
          <option value="ratones">Ratones</option>
          <option value="audio">Audio</option>
          <option value="accesorios">Accesorios</option>
        </select>
      </div>

      <div id="catalogo" class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-3"></div>
    </section>
  </main>

  <div id="modal-detalle" class="modal-overlay" aria-hidden="true">
    <div class="modal-contenido">
      <button type="button" class="btn-cerrar-modal" id="btn-cerrar-modal">&times;</button>
      <div id="contenido-modal"></div>
    </div>
  </div>

  <footer class="footer-principal">
    <p>&copy; 2026 AETHER Studio. Proyecto académico - Universidad Continental.</p>
  </footer>

  <script src="js/datos.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/app-bootstrap.js"></script>
  <script src="bootstrap/bootstrap.bundle.min.js"> </script>
</body>
</html>
