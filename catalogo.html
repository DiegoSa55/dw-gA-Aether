<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo | AETHER Studio</title>
  <link rel="stylesheet" href="bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="sticky-top border-bottom border-secondary">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
      <div class="container">
        <a class="navbar-brand fw-bold text-info" href="index.html">
          <i class="bi bi-cpu-fill me-2"></i>AETHER Studio
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir navegación">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link active" href="catalogo.html">Catálogo</a></li>
            <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
            <li class="nav-item">
              <a class="btn btn-outline-info position-relative" href="carrito.html">
                <i class="bi bi-cart3 me-1"></i>Carrito
                <span id="contador" class="badge bg-info text-dark ms-1">0</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-5">
    <div class="row align-items-center mb-4 g-3">
      <div class="col-12 col-md-5">
        <h1 class="h2 fw-bold text-white mb-0">
          <i class="bi bi-grid-3x3-gap-fill text-info me-2"></i>Catálogo de Productos
        </h1>
      </div>
      <div class="col-12 col-md-4">
        <div class="input-group">
          <span class="input-group-text bg-dark text-info border-secondary"><i class="bi bi-search"></i></span>
          <input type="text" id="buscador" class="form-control bg-dark text-white border-secondary" placeholder="Buscar periférico...">
        </div>
      </div>
      <div class="col-12 col-md-3">
        <select id="filtro-categoria" class="form-select bg-dark text-white border-secondary">
          <option value="todas">Todas las categorías</option>
          <option value="teclados">Teclados</option>
          <option value="ratones">Ratones</option>
          <option value="audio">Audio</option>
          <option value="accesorios">Accesorios</option>
        </select>
      </div>
    </div>

    <section id="catalogo" class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4" aria-live="polite"></section>
  </main>

  <!-- Modal de detalle conectado con app.js -->
  <div id="modal-detalle" class="modal-personalizado" aria-hidden="true">
    <div class="modal-caja card bg-dark border-secondary text-white p-4">
      <div class="d-flex justify-content-end">
        <button type="button" id="btn-cerrar-modal" class="btn-close btn-close-white" aria-label="Cerrar"></button>
      </div>
      <div id="contenido-modal"></div>
    </div>
  </div>

  <footer class="bg-dark border-top border-secondary py-4 mt-5">
    <div class="container text-center text-secondary">
      <p class="mb-0">&copy; 2026 AETHER Studio — Precisión en el hardware, precisión en el código.</p>
    </div>
  </footer>

  <script src="bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/calculos.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
